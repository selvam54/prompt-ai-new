<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Prompt AI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-bg-grid"></div>
  <div class="auth-glow auth-glow-1"></div>
  <div class="auth-glow auth-glow-2"></div>

  <div class="auth-box">
    <div class="auth-header">
      <a href="/" class="logo">⚡ Prompt AI</a>
      <h2>Welcome back</h2>
      <p>Sign in to your account to continue</p>
    </div>

    <div class="auth-card">
      <div id="alert" class="alert"></div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" />
      </div>

      <button id="loginBtn" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px" onclick="handleLogin()">
        Sign In →
      </button>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="/signup">Create one</a>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) window.location.href = '/';

    // Allow Enter key to submit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const alert = document.getElementById('alert');

      if (!email || !password) {
        return showAlert(alert, 'Please fill in all fields');
      }

      setLoading(btn, true, 'Signing in...');

      try {
        const data = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });

        Auth.save(data.token, data.user);
        window.location.href = '/';
      } catch (err) {
        showAlert(alert, err.message);
        setLoading(btn, false);
      }
    }
  </script>
</body>
</html>
